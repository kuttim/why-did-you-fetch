<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>why-did-you-fetch — vanilla example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 3rem auto;
        line-height: 1.6;
      }
      button {
        font-size: 1rem;
        padding: 0.5rem 1rem;
      }
      code {
        background: #eee;
        padding: 0.1rem 0.3rem;
        border-radius: 3px;
      }
    </style>
    <!--
      No build step. This import map is what makes `import ... from 'why-did-you-fetch'` below
      resolve in a plain browser — a real bundler (Vite, webpack, Next.js, ...) would let you
      write that same import and just resolve it against node_modules instead, no import map
      needed. See ../vite-react for that version.
    -->
    <script type="importmap">
      {
        "imports": {
          "why-did-you-fetch": "https://cdn.jsdelivr.net/npm/why-did-you-fetch@0.4.0/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>why-did-you-fetch — vanilla example</h1>
    <p>
      Open your browser console, then click the button. No install, no build — this page runs exactly as it's written
      below.
    </p>
    <button id="go">Fetch the same thing twice</button>
    <p id="status"></p>

    <script type="module">
      import { init } from 'why-did-you-fetch';

      init(); // no-ops automatically when NODE_ENV === 'production' in a bundled app

      document.getElementById('go').addEventListener('click', () => {
        // Two call sites firing the exact same request before either has settled — the
        // duplicate-inflight pattern. In a real app this is usually two components that
        // don't know about each other, not two calls sitting next to each other like this.
        fetch('https://jsonplaceholder.typicode.com/todos/1');
        fetch('https://jsonplaceholder.typicode.com/todos/1');
        document.getElementById('status').textContent = 'Fired — check the console.';
      });
    </script>
  </body>
</html>
